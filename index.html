<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移動 CO2排出量 計算</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-950 text-gray-100 min-h-screen p-4">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-center mb-1 text-white mt-4">🌿 移動 CO₂排出量 計算</h1>
    <p class="text-center text-green-400 text-sm mb-8">交通手段別の環境負荷を比較しよう</p>

    <!-- Input Section -->
    <div class="bg-green-900 bg-opacity-50 rounded-2xl p-6 mb-6 border border-green-800">
      <div class="grid grid-cols-1 gap-5">

        <!-- Transport Mode -->
        <div>
          <label class="block text-sm text-green-300 font-medium mb-3">交通手段を選択</label>
          <div class="grid grid-cols-3 gap-2" role="radiogroup" aria-label="交通手段">
            <label class="transport-option cursor-pointer">
              <input type="radio" name="transport" value="plane" class="sr-only" onchange="calculate()">
              <div class="transport-card border-2 border-green-700 bg-green-900 bg-opacity-50 rounded-xl p-3 text-center transition-all hover:border-green-500">
                <span class="block text-2xl mb-1">✈️</span>
                <span class="text-xs font-medium">飛行機</span>
                <span class="block text-xs text-green-500 mt-1">0.255 kg/km</span>
              </div>
            </label>
            <label class="transport-option cursor-pointer">
              <input type="radio" name="transport" value="shinkansen" class="sr-only" onchange="calculate()">
              <div class="transport-card border-2 border-green-700 bg-green-900 bg-opacity-50 rounded-xl p-3 text-center transition-all hover:border-green-500">
                <span class="block text-2xl mb-1">🚄</span>
                <span class="text-xs font-medium">新幹線</span>
                <span class="block text-xs text-green-500 mt-1">0.017 kg/km</span>
              </div>
            </label>
            <label class="transport-option cursor-pointer">
              <input type="radio" name="transport" value="train" class="sr-only" onchange="calculate()">
              <div class="transport-card border-2 border-green-700 bg-green-900 bg-opacity-50 rounded-xl p-3 text-center transition-all hover:border-green-500">
                <span class="block text-2xl mb-1">🚃</span>
                <span class="text-xs font-medium">在来線</span>
                <span class="block text-xs text-green-500 mt-1">0.019 kg/km</span>
              </div>
            </label>
            <label class="transport-option cursor-pointer">
              <input type="radio" name="transport" value="car" class="sr-only" onchange="calculate()">
              <div class="transport-card border-2 border-green-700 bg-green-900 bg-opacity-50 rounded-xl p-3 text-center transition-all hover:border-green-500">
                <span class="block text-2xl mb-1">🚗</span>
                <span class="text-xs font-medium">自家用車</span>
                <span class="block text-xs text-green-500 mt-1">0.138 kg/km</span>
              </div>
            </label>
            <label class="transport-option cursor-pointer">
              <input type="radio" name="transport" value="bus" class="sr-only" onchange="calculate()">
              <div class="transport-card border-2 border-green-700 bg-green-900 bg-opacity-50 rounded-xl p-3 text-center transition-all hover:border-green-500">
                <span class="block text-2xl mb-1">🚌</span>
                <span class="text-xs font-medium">バス</span>
                <span class="block text-xs text-green-500 mt-1">0.060 kg/km</span>
              </div>
            </label>
            <label class="transport-option cursor-pointer">
              <input type="radio" name="transport" value="bicycle" class="sr-only" onchange="calculate()">
              <div class="transport-card border-2 border-green-700 bg-green-900 bg-opacity-50 rounded-xl p-3 text-center transition-all hover:border-green-500">
                <span class="block text-2xl mb-1">🚲</span>
                <span class="text-xs font-medium">自転車</span>
                <span class="block text-xs text-green-500 mt-1">0.000 kg/km</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Distance Input -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="distance" class="block text-sm text-green-300 font-medium mb-2">距離 (km)</label>
            <input type="number" id="distance" min="1" max="20000" value="500"
              oninput="calculate()"
              class="w-full bg-green-900 border border-green-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-400 focus:ring-1 focus:ring-green-400"
              aria-label="移動距離をキロメートルで入力">
          </div>
          <div class="flex items-end pb-1">
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="checkbox" id="roundtrip" onchange="calculate()"
                class="w-5 h-5 accent-green-400 cursor-pointer"
                aria-label="往復にする">
              <span class="text-sm text-green-300 font-medium">往復</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Result Section -->
    <div id="result-section" class="hidden">
      <!-- Main Result -->
      <div class="bg-green-800 bg-opacity-40 rounded-2xl p-6 mb-4 border border-green-700 text-center">
        <div class="text-sm text-green-400 mb-1">あなたの移動の CO₂排出量</div>
        <div id="main-result" class="text-4xl font-bold text-white mb-1">—</div>
        <div id="tree-result" class="text-sm text-green-400">—</div>
      </div>

      <!-- Comparison Bar Chart -->
      <div class="bg-green-900 bg-opacity-40 rounded-2xl p-5 border border-green-800 mb-4">
        <h2 class="text-sm font-semibold text-green-300 mb-4">全交通手段の比較</h2>
        <div id="chart" class="space-y-3"></div>
      </div>

      <!-- Emissions Table -->
      <div class="bg-green-900 bg-opacity-40 rounded-2xl p-5 border border-green-800">
        <h2 class="text-sm font-semibold text-green-300 mb-3">排出係数の参考値（kg-CO₂/km・人）</h2>
        <div class="text-xs text-green-500 space-y-1">
          <div class="flex justify-between"><span>飛行機（国内線）</span><span>0.255</span></div>
          <div class="flex justify-between"><span>新幹線</span><span>0.017</span></div>
          <div class="flex justify-between"><span>在来線</span><span>0.019</span></div>
          <div class="flex justify-between"><span>自家用車（ガソリン）</span><span>0.138</span></div>
          <div class="flex justify-between"><span>バス（路線バス）</span><span>0.060</span></div>
          <div class="flex justify-between"><span>自転車</span><span>0.000</span></div>
          <p class="text-green-700 pt-2">出典: 国土交通省「交通の環境負荷」参考値</p>
        </div>
      </div>
    </div>

    <div id="empty-msg" class="text-center text-green-700 py-8">交通手段を選択して距離を入力してください</div>
  </div>

  <script>
    const TRANSPORTS = [
      { key: 'plane',      label: '✈️ 飛行機',   factor: 0.255, color: 'bg-red-500' },
      { key: 'car',        label: '🚗 自家用車', factor: 0.138, color: 'bg-orange-500' },
      { key: 'bus',        label: '🚌 バス',     factor: 0.060, color: 'bg-yellow-500' },
      { key: 'train',      label: '🚃 在来線',   factor: 0.019, color: 'bg-blue-400' },
      { key: 'shinkansen', label: '🚄 新幹線',   factor: 0.017, color: 'bg-green-400' },
      { key: 'bicycle',    label: '🚲 自転車',   factor: 0.000, color: 'bg-teal-400' },
    ];

    // Highlight selected transport
    document.querySelectorAll('input[name="transport"]').forEach(radio => {
      radio.addEventListener('change', function() {
        document.querySelectorAll('.transport-card').forEach(c => {
          c.classList.remove('border-green-400', 'bg-green-700');
          c.classList.add('border-green-700');
        });
        this.closest('.transport-option').querySelector('.transport-card')
          .classList.add('border-green-400', 'bg-green-700');
      });
    });

    function calculate() {
      const selectedRadio = document.querySelector('input[name="transport"]:checked');
      const distanceInput = parseFloat(document.getElementById('distance').value);
      const isRoundtrip = document.getElementById('roundtrip').checked;

      if (!selectedRadio || isNaN(distanceInput) || distanceInput <= 0) {
        document.getElementById('result-section').classList.add('hidden');
        document.getElementById('empty-msg').classList.remove('hidden');
        return;
      }

      document.getElementById('result-section').classList.remove('hidden');
      document.getElementById('empty-msg').classList.add('hidden');

      const distance = isRoundtrip ? distanceInput * 2 : distanceInput;
      const selectedKey = selectedRadio.value;
      const selectedT = TRANSPORTS.find(t => t.key === selectedKey);
      const selectedCO2 = selectedT.factor * distance;

      // Main result
      const resultEl = document.getElementById('main-result');
      if (selectedCO2 < 1) {
        resultEl.textContent = (selectedCO2 * 1000).toFixed(0) + ' g-CO₂';
      } else {
        resultEl.textContent = selectedCO2.toFixed(2) + ' kg-CO₂';
      }

      // Tree equivalent (1 tree absorbs ~22 kg CO2/year)
      const treeEl = document.getElementById('tree-result');
      if (selectedCO2 === 0) {
        treeEl.textContent = 'CO₂排出なし 🌱';
      } else {
        const trees = selectedCO2 / 22;
        if (trees < 1) {
          treeEl.textContent = '🌳 1本の木の年間吸収量の約 ' + (trees * 100).toFixed(1) + '%';
        } else {
          treeEl.textContent = '🌳 木 約 ' + trees.toFixed(2) + ' 本分の年間吸収量';
        }
      }

      // Bar chart
      const maxCO2 = Math.max(...TRANSPORTS.map(t => t.factor * distance), 0.001);
      let chartHtml = '';
      TRANSPORTS.forEach(t => {
        const co2 = t.factor * distance;
        const pct = (co2 / maxCO2 * 100).toFixed(1);
        const isSelected = t.key === selectedKey;
        const barWidth = Math.max(parseFloat(pct), co2 === 0 ? 0 : 1);
        const label = co2 < 1 ? (co2 * 1000).toFixed(0) + ' g' : co2.toFixed(2) + ' kg';
        chartHtml += '<div class="' + (isSelected ? 'bg-green-800 bg-opacity-40 rounded-lg p-1 -mx-1' : '') + '">';
        chartHtml += '<div class="flex items-center gap-2 mb-1">';
        chartHtml += '<span class="text-xs w-24 text-gray-300 shrink-0">' + t.label + '</span>';
        chartHtml += '<div class="flex-1 bg-green-950 rounded-full h-5 overflow-hidden">';
        chartHtml += '<div class="' + t.color + ' h-full rounded-full transition-all duration-500 flex items-center justify-end pr-2" style="width:' + barWidth + '%">';
        if (barWidth > 15) {
          chartHtml += '<span class="text-xs text-white font-mono">' + label + '</span>';
        }
        chartHtml += '</div></div>';
        if (barWidth <= 15) {
          chartHtml += '<span class="text-xs text-gray-400 font-mono w-16 shrink-0">' + label + '</span>';
        }
        chartHtml += '</div></div>';
      });
      document.getElementById('chart').innerHTML = chartHtml;
    }

    // Initialize with no selection shown
    document.getElementById('empty-msg').classList.remove('hidden');
  </script>
</body>
</html>
